name: Deploy Macro Radar Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: macroradar-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      # test_page_check.py builds pages from the collected out/*.json, so it runs
      # after collection. Everything else is source-independent and fails fast here.
      - name: Test generators and contracts
        run: python -m pytest -q --ignore=test_page_check.py

      # trade.py uses the prior snapshot only for the seven-day UN Comtrade
      # breakdown cache. It still refreshes data and page_check remains a hard
      # freshness gate, so a restored snapshot cannot turn a failed source green.
      - name: Restore UN Comtrade trade snapshot
        uses: actions/cache@v4
        with:
          path: out/trade.json
          key: macroradar-trade-${{ runner.os }}-${{ hashFiles('trade.py') }}
          restore-keys: |
            macroradar-trade-${{ runner.os }}-

      - name: Collect macro pulse
        run: python etl.py out/pulse.json

      - name: Collect trade data
        run: python trade.py out/trade.json

      - name: Reject stale trade data restored from cache
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          trade = json.loads(Path("out/trade.json").read_text(encoding="utf-8"))
          stale = [
              f"series:{row.get('series_id', 'unknown')}"
              for row in trade.get("series", [])
              if row.get("stale")
          ]
          stale.extend(
              f"breakdown:{row.get('id', 'unknown')}"
              for row in trade.get("breakdowns", [])
              if row.get("stale")
          )
          if stale:
              raise SystemExit(
                  "торговые данные не обновлены, публикация остановлена: "
                  + ", ".join(stale)
              )
          PY

      - name: Derive macro radar
        run: python radar.py out/radar.json out/pulse.json out/trade.json

      - name: Collect KGD budget
        run: python budget.py out/budget.json

      - name: Collect Minfin data
        run: python minfin.py out/minfin.json

      - name: Collect regional budget data
        run: python oblast.py out/oblast.json

      - name: Collect tax data
        run: python tax.py out/tax.json

      - name: Collect National Fund data
        run: python national_fund.py out/national_fund.json

      - name: Collect Energy Balance data
        run: python energy.py out/energy.json

      - name: Reject stale Energy Balance data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          energy = json.loads(Path("out/energy.json").read_text(encoding="utf-8"))
          stale = [
              row.get("series_id", "unknown")
              for row in energy.get("series", [])
              if row.get("stale")
          ]
          if stale:
              raise SystemExit(
                  "энергетические данные не обновлены, публикация остановлена: "
                  + ", ".join(stale)
              )
          PY

      - name: Collect Industry data
        run: python industry.py out/industry.json

      - name: Reject stale Industry data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          industry = json.loads(Path("out/industry.json").read_text(encoding="utf-8"))
          stale = [
              row.get("series_id", "unknown")
              for row in industry.get("series", [])
              if row.get("stale")
          ]
          if stale:
              raise SystemExit(
                  "отраслевые данные не обновлены, публикация остановлена: "
                  + ", ".join(stale)
              )
          PY

      - name: Collect Health data
        run: python health.py out/health.json

      - name: Reject stale Health data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("out/health.json").read_text(encoding="utf-8"))
          stale = [
              row.get("series_id", "unknown")
              for row in health.get("series", [])
              if row.get("stale")
          ]
          if stale:
              raise SystemExit(
                  "данные здравоохранения не обновлены, публикация остановлена: "
                  + ", ".join(stale)
              )
          PY

      - name: Collect Housing data
        run: python housing.py out/housing.json

      - name: Reject stale Housing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          housing = json.loads(Path("out/housing.json").read_text(encoding="utf-8"))
          stale = [
              row.get("series_id", "unknown")
              for row in housing.get("series", [])
              if row.get("stale")
          ]
          if stale:
              raise SystemExit(
                  "данные по жилью не обновлены, публикация остановлена: "
                  + ", ".join(stale)
              )
          PY

      # Площадки объявлений вторичны: при их отказе страница жилья выходит с пометкой
      # «нет данных», публикация не останавливается.
      - name: Collect listing prices (kn.kz, korter.kz)
        continue-on-error: true
        timeout-minutes: 10
        run: python listings.py out/listings.json

      # Число сделок из текста релизов БНС: при сбое разбора страница пишет «нет данных».
      - name: Collect housing deals from BNS releases
        continue-on-error: true
        timeout-minutes: 10
        run: python deals.py out/deals.json

      - name: Test page_check against collected data
        run: python -m pytest -q test_page_check.py

      - name: Test path-preserving Worker contract
        run: node --test worker/test_proxy.mjs

      - name: Build isolated Pages tree and run page_check
        run: >
          python scripts/build_pages.py --output dist
          --site-url https://jbs.finance --path-prefix /macroradar

      - name: Publish Macro Radar only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a290aa254b51e327ec66ae92696a9e1
          command: pages deploy dist --project-name=jbs-macroradar --branch=main

      - name: Deploy path-preserving Macro Radar Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6a290aa254b51e327ec66ae92696a9e1
          command: deploy --config worker/wrangler.toml

      - name: Smoke test Macro Radar public URL
        shell: bash
        run: |
          set -euo pipefail
          # grep -F takes PATTERNS literally: a leading ^ is a literal caret, not an
          # anchor, on both GNU and BSD grep. A header-presence check does not need
          # one, the header name is already distinctive enough on its own line.
          check_root_redirect() {
            local headers code
            headers="$(mktemp)"
            trap 'rm -f "$headers"' RETURN
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --max-time 30 https://jbs.finance/macroradar)"
              if [[ "$code" == "308" ]] && grep -Fqi 'location: https://jbs.finance/macroradar/' "$headers" && grep -Fqi 'x-macroradar-upstream: jbs-macroradar-pages' "$headers"; then
                return 0
              fi
              echo "Root redirect attempt ${attempt} failed: HTTP ${code}" >&2
              sleep 10
            done
            echo "Bare Macro Radar URL did not redirect through the isolated Worker" >&2
            return 1
          }
          check_page() {
            local path="$1"
            local canonical="$2"
            local body headers
            body="$(mktemp)"
            headers="$(mktemp)"
            trap 'rm -f "$body" "$headers"' RETURN
            for attempt in 1 2 3 4 5 6; do
              code="$(curl --location --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' --max-time 30 "https://jbs.finance${path}")"
              if [[ "$code" == "200" ]] && grep -Fq "<link rel=\"canonical\" href=\"${canonical}\">" "$body" && grep -Fq 'href="/macroradar/' "$body" && grep -Fq 'https://jbs.finance/macroradar/' "$body" && grep -Fqi 'x-macroradar-upstream: jbs-macroradar-pages' "$headers"; then
                return 0
              fi
              echo "Smoke attempt ${attempt} failed for ${path}: HTTP ${code}" >&2
              sleep 10
            done
            echo "Smoke test failed for ${path}" >&2
            return 1
          }
          check_root_redirect
          check_page /macroradar/ https://jbs.finance/macroradar/
          check_page /macroradar/macro/ https://jbs.finance/macroradar/macro/
          check_page /macroradar/energy/ https://jbs.finance/macroradar/energy/
          check_page /macroradar/industry/ https://jbs.finance/macroradar/industry/
          check_page /macroradar/health/ https://jbs.finance/macroradar/health/
          check_page /macroradar/housing/ https://jbs.finance/macroradar/housing/
          check_page /macroradar/methodology/ https://jbs.finance/macroradar/methodology/
